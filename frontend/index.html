<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CSP (endurecimiento S7): solo scripts y estilos propios o de la ruta exacta de Bootstrap 5.3.3
         en jsDelivr (con SRI), sin scripts en línea, y conexiones solo a la API (URL_API de js/api.js). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/; style-src 'self' https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:3000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>CRM Belleza · Vendedores</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-md bg-body border-bottom">
      <div class="container">
        <span class="navbar-brand fw-semibold">CRM Belleza</span>
        <!-- El contenedor externo se oculta sin sesión; el interno organiza los enlaces. -->
        <div id="nav-enlaces" class="d-none ms-auto">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <a class="nav-link px-2" href="#/cartera">Cartera</a>
            <a class="nav-link px-2" href="#/oportunidades">Oportunidades</a>
            <a class="nav-link px-2" href="#/actividades">Actividades</a>
            <a class="nav-link px-2" href="#/resumen">Resumen</a>
            <span class="text-body-secondary small px-2" id="nav-usuario"></span>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-accion="cerrar-sesion">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-3">
      <div id="avisos" class="mb-3" aria-live="polite"></div>
      <div id="app"></div>
      <noscript><div class="alert alert-warning">Esta aplicación necesita JavaScript.</div></noscript>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
